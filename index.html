    <style>
        * {

        /* FUTURISTIC MOBILE CONTROLS */
        .controls{position:absolute;z-index:10;left:18px;right:18px;bottom:18px;height:190px;pointer-events:none}
        .joystick{position:absolute;left:0;bottom:0;width:176px;height:176px;border-radius:50%;touch-action:none;pointer-events:auto;user-select:none;background:radial-gradient(circle,rgba(24,43,94,.94) 0 42%,rgba(12,24,61,.88) 43% 68%,rgba(8,18,48,.58) 69%);border:3px solid rgba(45,164,255,.8);box-shadow:0 0 0 8px rgba(31,110,220,.16),0 0 35px rgba(0,166,255,.32),inset 0 0 28px rgba(64,137,255,.28)}
        .joystick::before{content:"";position:absolute;inset:14px;border:1px solid rgba(90,191,255,.42);border-radius:50%}.joystick::after{content:"";position:absolute;inset:46px;border:1px solid rgba(90,191,255,.2);border-radius:50%}
        .joyArrow{position:absolute;color:#7cc8ff;font-size:25px;font-weight:900;text-shadow:0 0 10px #169eff;pointer-events:none}.joyUp{top:17px;left:75px}.joyDown{bottom:17px;left:75px}.joyLeft{left:18px;top:73px}.joyRight{right:18px;top:73px}
        .joystickKnob{position:absolute;width:78px;height:78px;left:49px;top:49px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dff8ff,#56c9ff 38%,#1688ed 72%,#0b4db2);border:3px solid rgba(225,249,255,.85);box-shadow:0 0 22px rgba(37,190,255,.85),inset 0 0 16px rgba(255,255,255,.35);transform:translate3d(0,0,0);transition:transform .10s ease-out;pointer-events:none}.joystickKnob::after{content:"";position:absolute;inset:22px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}
        .attack{position:absolute;right:18px;bottom:8px;width:102px;height:102px;border-radius:50%;border:3px solid #ffb13b;color:white;font-size:38px;font-weight:bold;cursor:pointer;touch-action:none;pointer-events:auto;background:radial-gradient(circle,#21386f 0 46%,#101d4a 47% 72%,#0b1430 73%);box-shadow:0 0 0 7px rgba(255,139,0,.12),0 0 30px rgba(255,143,0,.55),inset 0 0 24px rgba(255,158,30,.25)}.attack::after{content:"FIRE";position:absolute;left:0;right:0;bottom:12px;font-size:10px;letter-spacing:2px;color:#ffd98b}.attack:active{transform:scale(.93);box-shadow:0 0 0 7px rgba(255,139,0,.18),0 0 45px rgba(255,143,0,.8),inset 0 0 28px rgba(255,158,30,.35)}
        .weaponBtn{position:absolute;right:132px;bottom:25px;width:74px;height:74px;border-radius:50%;border:2px solid #56c9ff;color:#e9f8ff;font-size:27px;font-weight:bold;cursor:pointer;touch-action:none;pointer-events:auto;background:radial-gradient(circle,#173e72 0 42%,#0d214a 43% 72%,#07132f 73%);box-shadow:0 0 0 5px rgba(55,190,255,.10),0 0 24px rgba(0,190,255,.42),inset 0 0 18px rgba(80,200,255,.18)}.weaponBtn:active{transform:scale(.92)}.weaponLabel{position:absolute;left:0;right:0;bottom:-17px;text-align:center;font-size:9px;letter-spacing:1.4px;color:#9ee8ff;pointer-events:none}.weaponName{position:absolute;right:132px;bottom:106px;min-width:74px;text-align:center;padding:5px 8px;border-radius:10px;background:rgba(5,16,42,.78);border:1px solid rgba(86,201,255,.35);color:#dff8ff;font-size:10px;letter-spacing:1px;pointer-events:none}        
        @media(max-width:600px){.controls{left:10px;right:10px;bottom:10px;height:170px}.joystick{width:154px;height:154px}.joystickKnob{width:68px;height:68px;left:43px;top:43px}.joyUp,.joyDown{left:65px}.joyLeft{left:15px;top:63px}.joyRight{right:15px}.attack{width:86px;height:86px;right:8px;bottom:4px;font-size:31px}.weaponBtn{width:62px;height:62px;right:102px;bottom:12px;font-size:23px}.weaponName{right:98px;bottom:84px;font-size:9px;min-width:62px}}

<body>
    <div id="game">
        <!-- BACKGROUND STARS -->
        <div id="stars"></div>

        <!-- HOME -->
        <section id="home">
            <div class="homeBox">
                <div class="smallTitle">MHP GAMING DIVISION</div>
                <div class="logo">RAVENIX</div>
                <p class="tagline">
                    Enter the dark arena. Move fast, attack enemies
                    and become the ultimate RAVENIX champion.
                </p>
                <button class="startBtn" onclick="startGame()">
                    ⚡ START GAME
                </button>
                <div class="infoRow">
                    <div class="info">🎮 FAST ACTION</div>
                    <div class="info">👾 ENEMIES</div>
                    <div class="info">💥 ATTACK</div>
                    <div class="info">🏆 SCORE</div>
                    <div class="info">📱 MOBILE</div>
                </div>
            </div>
        </section>

        <!-- GAME SCREEN -->
        <section id="gameScreen">
            <canvas id="canvas"></canvas>

            <div id="hud">
                <div class="stat">
                    <small>SCORE</small>
                    <b id="score">0</b>
                </div>
                <div class="stat">
                    <small>LEVEL</small>
                    <b id="level">1</b>
                </div>
                <div class="stat">
                    <small>HEALTH</small>
                    <b id="health">100</b>
                </div>
                <div class="stat">
                    <small>TIME</small>
                    <b id="time">60</b>
                </div>
            </div>

            <button class="exitBtn" onclick="exitGame()">✕</button>

            <!-- SMOOTH ANALOG CONTROLS -->
            <div class="controls">
                <div class="joystick" id="joystick" aria-label="Movement joystick">
                    <span class="joyArrow joyUp">▲</span><span class="joyArrow joyDown">▼</span>
                    <span class="joyArrow joyLeft">◀</span><span class="joyArrow joyRight">▶</span>
                    <div class="joystickKnob" id="joystickKnob"></div>
                </div>
                <button class="weaponBtn" id="weaponButton" aria-label="Change weapon">⚙️</button>
                <div class="weaponName" id="weaponName">LASER</div>
                <div class="weaponLabel">WEAPON</div>
                <button class="attack" id="attackButton" aria-label="Fire">🚀</button>
            </div>
        </section>

        <!-- GAME OVER -->
        <section id="gameOver">
            <div class="overBox">
                <h2>GAME OVER</h2>
                <div class="finalScore">
                    FINAL SCORE:
                    <b id="finalScore">0</b>
                </div>
                <button class="restart" onclick="restartGame()">
                    🔄 PLAY AGAIN
                </button>
            </div>
        </section>
    </div>

    <script>
        // Background Stars
        const stars = document.getElementById("stars");
        for (let i = 0; i < 90; i++) {
            const s = document.createElement("div");
            s.className = "star";
            s.style.left = Math.random() * 100 + "%";
            s.style.top = Math.random() * 100 + "%";
            s.style.animationDuration = (5 + Math.random() * 10) + "s";
            s.style.opacity = Math.random();
            stars.appendChild(s);
        }

        // Canvas Setup
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let W, H;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        // Game Variables
        let running = false;
        let score = 0, level = 1, health = 100, time = 60;
        let joystickX = 0, joystickY = 0;
        const weapons = [
            { name: "LASER", icon: "⚡", range: 130, score: 100, color: "#66d9ff" },
            { name: "PLASMA", icon: "✦", range: 180, score: 125, color: "#b38cff" },
            { name: "MISSILE", icon: "🚀", range: 230, score: 150, color: "#ffb13b" }
        ];
        let weaponIndex = 0;
        let player = { x: 0, y: 0, size: 25, speed: 6 };
        let enemies = [], particles = [];
        let lastTime = 0, timerInterval;

        // Start Game
        function startGame() {
            document.getElementById("home").style.display = "none";
            document.getElementById("gameScreen").classList.add("active");
            document.getElementById("gameOver").style.display = "none";

            score = 0; level = 1; health = 100; time = 60;
            player.x = W / 2; player.y = H / 2;
            enemies = []; particles = [];

            spawnEnemy(); spawnEnemy();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!running) return;
                time--;
                updateHUD();
                if (time <= 0) endGame();
            }, 1000);

            running = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(now) {
            if (!running) return;
            const dt = Math.min((now - lastTime) / 16.67, 2);
            lastTime = now;
            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            let speed = player.speed;
            // Smooth analog movement: direction and speed are proportional
            // to how far the joystick is pushed.
            player.x += joystickX * speed * dt;
            player.y += joystickY * speed * dt;
            if (keys["ArrowUp"] || keys["w"]) player.y -= speed * dt;
            if (keys["ArrowDown"] || keys["s"]) player.y += speed * dt;
            if (keys["ArrowLeft"] || keys["a"]) player.x -= speed * dt;
            if (keys["ArrowRight"] || keys["d"]) player.x += speed * dt;

            player.x = Math.max(30, Math.min(W - 30, player.x));
            player.y = Math.max(90, Math.min(H - 90, player.y));

            enemies.forEach(enemy => {
                let dx = player.x - enemy.x, dy = player.y - enemy.y;
                let distance = Math.hypot(dx, dy);
                if (distance > 1) {
                    enemy.x += (dx / distance) * enemy.speed * dt;
                    enemy.y += (dy / distance) * enemy.speed * dt;
                }
                if (distance < 42) {
                    health -= 0.5 * dt;
                    if (health <= 0) { health = 0; endGame(); }
                }
            });

            particles.forEach(p => {
                p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
            });
            particles = particles.filter(p => p.life > 0);
            if (particles.length > 300) particles.splice(0, particles.length - 300);

            level = Math.floor(score / 500) + 1;
            if (enemies.length < Math.min(2 + level, 8)) {
                if (Math.random() < 0.025 * dt) spawnEnemy();
            }
            updateHUD();
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = "rgba(3,7,20,.20)";
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = "rgba(100,120,255,.06)";
            ctx.lineWidth = 1;
            const grid = 55;
            for (let x = 0; x < W; x += grid) {
                ctx.beginPath(); ctx.moveTo(x, 70); ctx.lineTo(x, H); ctx.stroke();
            }
            for (let y = 70; y < H; y += grid) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
            }

            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life / 30);
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            enemies.forEach(enemy => {
                ctx.save();
                const glow = ctx.createRadialGradient(enemy.x, enemy.y, 3, enemy.x, enemy.y, 48);
                glow.addColorStop(0, "rgba(255,55,150,.65)"); glow.addColorStop(1, "rgba(255,30,120,0)");
                ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(enemy.x, enemy.y, 48, 0, Math.PI * 2); ctx.fill();
                ctx.translate(enemy.x, enemy.y); ctx.rotate(performance.now()/1200);
                const pulse = 18 + Math.sin(performance.now()/180 + enemy.x)*2;
                ctx.beginPath();
                for(let i=0;i<16;i++){const a=i*Math.PI/8,r=i%2===0?pulse+8:pulse-3,x=Math.cos(a)*r,y=Math.sin(a)*r;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
                ctx.closePath(); ctx.fillStyle="#ff2f88"; ctx.shadowBlur=18; ctx.shadowColor="#ff2f88"; ctx.fill();
                ctx.shadowBlur=0; ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2);
                const core=ctx.createRadialGradient(-3,-3,1,0,0,13); core.addColorStop(0,"#ffffff"); core.addColorStop(.35,"#ffb9e0"); core.addColorStop(1,"#a6005e");
                ctx.fillStyle=core; ctx.fill(); ctx.strokeStyle="#ffd1ed"; ctx.lineWidth=2; ctx.stroke();
                ctx.restore();
            });

            const pg = ctx.createRadialGradient(player.x, player.y, 3, player.x, player.y, 55);
            pg.addColorStop(0, "rgba(90,130,255,.8)"); pg.addColorStop(1, "rgba(90,130,255,0)");
            ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(player.x, player.y, 55, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#728cff"; ctx.beginPath(); ctx.arc(player.x, player.y, 23, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#c9d2ff"; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(player.x, player.y, 7, 0, Math.PI * 2); ctx.fill();
        }

        function spawnEnemy() {
            let side = Math.floor(Math.random() * 4);
            let x, y;
            if (side === 0) { x = 30; y = 100 + Math.random() * (H - 180); }
            if (side === 1) { x = W - 30; y = 100 + Math.random() * (H - 180); }
            if (side === 2) { x = Math.random() * W; y = 100; }
            if (side === 3) { x = Math.random() * W; y = H - 90; }
            enemies.push({ x, y, speed: 1.0 + level * 0.15 });
        }

        function attack() {
            if (!running) return;

            const weapon = weapons[weaponIndex];
            let hit = false;
            const newEnemies = [];

            enemies.forEach(enemy => {
                const d = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if (d < weapon.range) {
                    hit = true;
                    score += weapon.score;
                    explosion(enemy.x, enemy.y, weapon.color);
                } else {
                    newEnemies.push(enemy);
                }
            });

            enemies = newEnemies;

            // Weapon-specific firing particles.
            const burst = weaponIndex === 2 ? 20 : weaponIndex === 1 ? 16 : 12;
            for (let i = 0; i < burst; i++) {
                particles.push({
                    x: player.x, y: player.y,
                    vx: (Math.random() - .5) * (weaponIndex === 2 ? 15 : 10),
                    vy: (Math.random() - .5) * (weaponIndex === 2 ? 15 : 10),
                    size: Math.random() * 4 + 2,
                    life: 25,
                    color: weapon.color
                });
            }

            updateHUD();
        }

        function cycleWeapon() {
            weaponIndex = (weaponIndex + 1) % weapons.length;
            const weapon = weapons[weaponIndex];
            const button = document.getElementById("weaponButton");
            const name = document.getElementById("weaponName");

            button.textContent = weapon.icon;
            name.textContent = weapon.name;
            name.style.color = weapon.color;
            button.style.borderColor = weapon.color;
            button.style.boxShadow =
                `0 0 0 5px rgba(55,190,255,.10), 0 0 28px ${weapon.color}, inset 0 0 18px rgba(80,200,255,.18)`;
        }

        function explosion(x, y, color = "#ff5577") {
            for (let i = 0; i < 22; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - .5) * 9, vy: (Math.random() - .5) * 9,
                    size: Math.random() * 5 + 1, life: 35, color
                });
            }
        }

        function updateHUD() {
            document.getElementById("score").textContent = score;
            document.getElementById("level").textContent = level;
            document.getElementById("health").textContent = Math.ceil(health);
            document.getElementById("time").textContent = time;
        }

        function endGame() {
            if (!running) return;
            running = false;
            clearInterval(timerInterval);
            document.getElementById("finalScore").textContent = score;
            document.getElementById("gameOver").style.display = "flex";
        }

        function restartGame() { startGame(); }
        function exitGame() {
            running = false; clearInterval(timerInterval);
            document.getElementById("gameScreen").classList.remove("active");
            document.getElementById("gameOver").style.display = "none";
            document.getElementById("home").style.display = "flex";
        }

        const keys = {};
        document.addEventListener("keydown", e => {
            keys[e.key] = true;
            if (e.code === "Space") { e.preventDefault(); attack(); }
        });
        document.addEventListener("keyup", e => { keys[e.key] = false; });

        // Smooth analog joystick
        const joystick = document.getElementById("joystick");
        const joystickKnob = document.getElementById("joystickKnob");
        const attackButton = document.getElementById("attackButton");
        const weaponButton = document.getElementById("weaponButton");
        let joystickPointerId = null;

        function setJoystickFromPointer(clientX, clientY) {
            const rect = joystick.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const maxRadius = rect.width * 0.29;

            let dx = clientX - cx;
            let dy = clientY - cy;
            const distance = Math.hypot(dx, dy);

            if (distance > maxRadius) {
                const scale = maxRadius / distance;
                dx *= scale;
                dy *= scale;
            }

            joystickX = dx / maxRadius;
            joystickY = dy / maxRadius;

            // Dead zone prevents tiny accidental movement.
            const magnitude = Math.hypot(joystickX, joystickY);
            if (magnitude < 0.10) {
                joystickX = 0;
                joystickY = 0;
            }

            joystickKnob.style.transition = "none";
            joystickKnob.style.transform =
                `translate3d(${dx}px, ${dy}px, 0)`;
        }

        function resetJoystick() {
            joystickPointerId = null;
            joystickX = 0;
            joystickY = 0;
            joystickKnob.style.transition = "transform .12s ease-out";
            joystickKnob.style.transform = "translate3d(0,0,0)";
        }

        joystick.addEventListener("pointerdown", e => {
            e.preventDefault();
            joystickPointerId = e.pointerId;
            joystick.setPointerCapture(e.pointerId);
            setJoystickFromPointer(e.clientX, e.clientY);
        });

        joystick.addEventListener("pointermove", e => {
            if (e.pointerId !== joystickPointerId) return;
            e.preventDefault();
            setJoystickFromPointer(e.clientX, e.clientY);
        });

        joystick.addEventListener("pointerup", e => {
            if (e.pointerId === joystickPointerId) resetJoystick();
        });

        joystick.addEventListener("pointercancel", e => {
            if (e.pointerId === joystickPointerId) resetJoystick();
        });

        joystick.addEventListener("lostpointercapture", resetJoystick);

        attackButton.addEventListener("pointerdown", e => {
            e.preventDefault();
            attack();
        });

        weaponButton.addEventListener("pointerdown", e => {
            e.preventDefault();
            cycleWeapon();
        });

        // Stop the browser from scrolling/zooming while using game controls.
        document.addEventListener("touchmove", e => {
            if (e.target.closest(".joystick") || e.target.closest("#attackButton") || e.target.closest("#weaponButton")) {
                e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener("blur", resetJoystick);
    </script>
</body>
</html>
