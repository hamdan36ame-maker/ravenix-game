<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .input-section {
            padding: 25px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            gap: 10px;
        }

        .input-section input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-section input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .add-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .filter-section {
            padding: 15px 25px;
            display: flex;
            gap: 10px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .filter-btn:hover {
            border-color: #667eea;
        }

        .stats {
            padding: 15px 25px;
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.9em;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            color: #888;
            font-size: 0.85em;
        }

        .todos-section {
            max-height: 400px;
            overflow-y: auto;
            padding: 20px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            animation: fadeIn 0.3s ease-out;
            transition: all 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item:hover {
            background: #e8e9fa;
            transform: translateX(5px);
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .todo-text {
            flex: 1;
            font-size: 1em;
            color: #333;
            word-break: break-word;
        }

        .priority-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-high {
            background: #ffe0e0;
            color: #d32f2f;
        }

        .priority-medium {
            background: #fff3cd;
            color: #ff9800;
        }

        .priority-low {
            background: #e8f5e9;
            color: #388e3c;
        }

        .delete-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #ff6b6b;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: #ff5252;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .empty-state p {
            margin-bottom: 5px;
        }

        .footer {
            padding: 15px 25px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #888;
            font-size: 0.85em;
        }

        .clear-all-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            margin: 5px;
            transition: all 0.2s;
        }

        .clear-all-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .clear-completed-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            margin: 5px;
            transition: all 0.2s;
        }

        .clear-completed-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .action-buttons {
            padding: 15px 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            border-top: 1px solid #e0e0e0;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2em;
            }

            .container {
                max-width: 100%;
            }

            .input-section {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .filter-section {
                justify-content: flex-start;
            }

            .stats {
                flex-direction: column;
                gap: 10px;
            }
        }

        /* Scrollbar styling */
        .todos-section::-webkit-scrollbar {
            width: 8px;
        }

        .todos-section::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .todos-section::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        .todos-section::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📝 Todo List</h1>
            <p>Stay organized and productive</p>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <input type="text" id="todoInput" placeholder="Add a new task..." autocomplete="off">
            <select id="prioritySelect" style="padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em; cursor: pointer;">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
            <button class="add-btn">+ Add</button>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="high">High Priority</button>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="activeCount">0</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <!-- Todos Section -->
        <div class="todos-section" id="todosList">
            <div class="empty-state">
                <div class="empty-state-icon">🎉</div>
                <p>No tasks yet!</p>
                <p>Add one to get started</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="clear-completed-btn" id="clearCompletedBtn">Clear Completed</button>
            <button class="clear-all-btn" id="clearAllBtn">Clear All</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            💡 Your tasks are saved automatically
        </div>
    </div>

    <script>
        // Todo List Application with Local Storage
        class TodoApp {
            constructor() {
                this.todos = this.loadTodos();
                this.currentFilter = 'all';
                this.todoInput = document.getElementById('todoInput');
                this.prioritySelect = document.getElementById('prioritySelect');
                this.addBtn = document.querySelector('.add-btn');
                this.todosList = document.getElementById('todosList');
                this.filterBtns = document.querySelectorAll('.filter-btn');
                this.clearCompletedBtn = document.getElementById('clearCompletedBtn');
                this.clearAllBtn = document.getElementById('clearAllBtn');

                this.initEventListeners();
                this.render();
            }

            initEventListeners() {
                this.addBtn.addEventListener('click', () => this.addTodo());
                this.todoInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTodo();
                });

                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.filterBtns.forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentFilter = e.target.dataset.filter;
                        this.render();
                    });
                });

                this.clearCompletedBtn.addEventListener('click', () => this.clearCompleted());
                this.clearAllBtn.addEventListener('click', () => this.clearAll());
            }

            addTodo() {
                const text = this.todoInput.value.trim();
                const priority = this.prioritySelect.value;

                if (text === '') {
                    alert('Please enter a task!');
                    return;
                }

                const todo = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    priority: priority,
                    createdAt: new Date().toLocaleString()
                };

                this.todos.unshift(todo);
                this.saveTodos();
                this.todoInput.value = '';
                this.prioritySelect.value = 'medium';
                this.render();
            }

            deleteTodo(id) {
                this.todos = this.todos.filter(todo => todo.id !== id);
                this.saveTodos();
                this.render();
            }

            toggleTodo(id) {
                const todo = this.todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = !todo.completed;
                    this.saveTodos();
                    this.render();
                }
            }

            clearCompleted() {
                if (confirm('Are you sure you want to clear all completed tasks?')) {
                    this.todos = this.todos.filter(todo => !todo.completed);
                    this.saveTodos();
                    this.render();
                }
            }

            clearAll() {
                if (confirm('Are you sure you want to delete all tasks? This cannot be undone!')) {
                    this.todos = [];
                    this.saveTodos();
                    this.render();
                }
            }

            getFilteredTodos() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.todos.filter(todo => !todo.completed);
                    case 'completed':
                        return this.todos.filter(todo => todo.completed);
                    case 'high':
                        return this.todos.filter(todo => todo.priority === 'high');
                    default:
                        return this.todos;
                }
            }

            updateStats() {
                const total = this.todos.length;
                const active = this.todos.filter(t => !t.completed).length;
                const completed = this.todos.filter(t => t.completed).length;

                document.getElementById('totalCount').textContent = total;
                document.getElementById('activeCount').textContent = active;
                document.getElementById('completedCount').textContent = completed;
            }

            render() {
                const filteredTodos = this.getFilteredTodos();
                this.updateStats();

                if (filteredTodos.length === 0) {
                    this.todosList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">✨</div>
                            <p>No tasks in this category</p>
                            <p>${this.currentFilter === 'completed' ? 'Great job keeping up!' : 'Time to add one!'}</p>
                        </div>
                    `;
                    return;
                }

                this.todosList.innerHTML = filteredTodos.map(todo => `
                    <div class="todo-item ${todo.completed ? 'completed' : ''}">
                        <input type="checkbox" class="checkbox" ${todo.completed ? 'checked' : ''} onchange="todoApp.toggleTodo(${todo.id})">
                        <div class="todo-text">${this.escapeHtml(todo.text)}</div>
                        <span class="priority-badge priority-${todo.priority}">${todo.priority}</span>
                        <button class="delete-btn" onclick="todoApp.deleteTodo(${todo.id})">🗑️</button>
                    </div>
                `).join('');
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            saveTodos() {
                localStorage.setItem('todos', JSON.stringify(this.todos));
            }

            loadTodos() {
                const stored = localStorage.getItem('todos');
                return stored ? JSON.parse(stored) : [];
            }
        }

        // Initialize app
        const todoApp = new TodoApp();
    </script>
</body>
</html>
